services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - zeitbuch_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Bitte APP_DOMAIN in .env setzen}
      ZEITBUCH_USER: ${ZEITBUCH_USER:?Bitte ZEITBUCH_USER in .env setzen}
      ZEITBUCH_PASSWORD_HASH: ${ZEITBUCH_PASSWORD_HASH:?Bitte ZEITBUCH_PASSWORD_HASH in .env setzen}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  zeitbuch_data:
  caddy_data:
  caddy_config:
